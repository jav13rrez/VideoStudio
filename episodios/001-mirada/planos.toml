# Lista de planos: por qué te miro así
#
# Un plano por idea. «empieza» copia las primeras palabras del plano tal como están en el guion;
# cada plano dura hasta que empieza el siguiente. Formato: docs/lista-de-planos.md.
#
# Escena (acotaciones.md): el sofá del salón, de noche, con la lámpara de pie encendida.
# El recibidor solo sale cuando el Tutor pregunta por la vuelta del trabajo.

# Escenarios que todavía no están en la biblioteca: el creador los aprueba la primera vez.
escenarios_nuevos = ["salon", "recibidor"]

[[plano]]
id = "01"
empieza = "¿Por qué me miras"
escenario = "salon"
encuadre = "plano medio del Tutor en el sofá, con el móvil en una mano y el bocadillo en la otra"
camara = "fija"
motivo = "el gancho es la pregunta del Tutor: que se vea su cara al descubrir la mirada"
personajes = { Tutor = "levanta la vista del móvil y se da cuenta de que le miran" }
objeto = "bocadillo"

