# Configuración del estudio. La herramienta del estudio la busca desde la carpeta del episodio
# hacia arriba y usa la primera que encuentra. Formato: docs/voces-y-linea-de-tiempo.md.

# Fotogramas por segundo. Todos los tiempos del episodio se cuentan en fotogramas.
fps = 30

# Silencio entre una frase y la siguiente, en fotogramas (a 30 fps, 9 fotogramas = 0,3 segundos).
pausa_entre_frases = 9

# Proveedor y voz de cada personaje. Cambiar de proveedor es cambiar la línea del personaje.
# Proveedores que hay: "kokoro" (voz gratuita hecha en el PC; voces em_santa, em_alex y ef_dora),
# "grabacion" (audios que graba el creador en grabaciones/ del episodio) y "falso" (silencio, para pruebas).
# Voces elegidas por el creador el 2026-11-10 (ticket 13).
[voces]
Perro = { proveedor = "kokoro", voz = "em_santa" }
Tutor = { proveedor = "kokoro", voz = "em_alex" }
